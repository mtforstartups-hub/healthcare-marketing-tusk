# pnpm settings for this repository.
# Dependency build scripts must be allow-listed explicitly.
strictDepBuilds: true
allowBuilds:
  esbuild: true
  fsevents: true
  sharp: true
  unrs-resolver: true
# Keep the package store inside the checkout so builds do not depend on a
# machine-global location.
storeDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}
cacheDir: ${SITES_PNPM_SHARED_STORE:-.sites-runtime/pnpm-store}/policy-cache
verifyDepsBeforeRun: false
